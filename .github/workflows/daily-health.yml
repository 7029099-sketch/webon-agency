name: Daily WebON Agency SEO Health

on:
  schedule:
    - cron: '53 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check English pages, canonicals and sitemap
        shell: bash
        run: |
          set -euo pipefail
          CURL_USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
          curl() { command curl --user-agent "$CURL_USER_AGENT" "$@"; }

          origin="https://webon.agency"
          curl -fsSL --retry 3 --max-time 30 "$origin/robots.txt" -o /tmp/agency-robots.txt
          curl -fsSL --retry 3 --max-time 30 "$origin/sitemap.xml" -o /tmp/agency-sitemap.xml
          grep -Fq "Sitemap: $origin/sitemap.xml" /tmp/agency-robots.txt

          python3 - <<'PY' > /tmp/agency-urls.txt
          import sys
          from xml.etree import ElementTree as ET
          root = ET.parse("/tmp/agency-sitemap.xml").getroot()
          urls = [loc.text.strip() for loc in root.findall(".//{*}loc") if loc.text]
          if not urls or any(not url.startswith("https://webon.agency/") for url in urls):
              sys.exit("Sitemap contains no pages or URL on a different domain")
          print("\n".join(urls))
          PY

          while IFS= read -r url; do
            echo "Checking $url"
            body="$(mktemp)"
            curl -fsSL --retry 3 --max-time 30 "$url" -o "$body"
            grep -qi '<title' "$body" || { echo "Missing title: $url"; exit 1; }
            grep -qi 'name="description"' "$body" || { echo "Missing description: $url"; exit 1; }
            grep -qi 'rel="canonical"' "$body" || { echo "Missing canonical: $url"; exit 1; }
            grep -qi '<h1' "$body" || { echo "Missing H1: $url"; exit 1; }
            grep -Fq 'https://webon.agency/' "$body" || { echo "Missing self-domain URL: $url"; exit 1; }
            rm -f "$body"
          done < /tmp/agency-urls.txt
          echo "WebON Agency SEO health check OK"

      - name: Record SEO monitor failure as issue
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_LABEL: 'webon-agency'
          WORKFLOW_NAME: 'daily-health.yml'
        shell: bash
        run: |
          set -euo pipefail
          title="SEO alert: ${SITE_LABEL} / ${WORKFLOW_NAME}"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            echo "Existing SEO alert #$existing; not creating a duplicate." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "$title" --body "Automated read-only SEO check failed for **${SITE_LABEL}**. [Open failed workflow run]($url). Investigate the failed step before editing any site." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve previous SEO monitor issue after recovery
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_LABEL: 'webon-agency'
          WORKFLOW_NAME: 'daily-health.yml'
        shell: bash
        run: |
          set -euo pipefail
          title="SEO alert: ${SITE_LABEL} / ${WORKFLOW_NAME}"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${GITHUB_REPOSITORY}" --comment "Automatic check recovered: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Resolved SEO monitor issue #$existing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SEO monitor healthy; no open alert." >> "$GITHUB_STEP_SUMMARY"
          fi
