name: Deploy WebON Agency to ADM.tools
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webon-agency-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Check ready-to-deploy site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f sitemap.xml
          test -f robots.txt
          test -d assets
          grep -qi 'webon.agency' index.html
          grep -qi '<html[^>]*lang="en"' index.html
          test ! -f .deploy-blocked
          if grep -REqi 'https?://([^/" ]+\.)?(webon\.com\.ua|liveon\.com\.ua|videolive\.com\.ua)' --include='*.html' --include='*.css' --include='*.js' .; then
            echo 'Unexpected Ukrainian-site link found; aborting deployment.'
            exit 1
          fi

      - name: Set up verified SSH host
        shell: bash
        env:
          KNOWN_HOSTS: ${{ secrets.WEBON_AGENCY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KNOWN_HOSTS" || { echo 'Set WEBON_AGENCY_SSH_KNOWN_HOSTS in Actions secrets'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Deploy to WebON Agency only
        shell: bash
        env:
          SSH_PASSWORD: ${{ secrets.WEBON_AGENCY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'Set WEBON_AGENCY_SSH_PASSWORD in Actions secrets'; exit 1; }
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -avz --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='README.md' \
            -e "ssh -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes" \
            ./ bb471191@bb471191.ftp.tools:/home/bb471191/webon.agency/www/

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 30 https://webon.agency/ -o /tmp/webon-agency.html
          grep -qi 'webon' /tmp/webon-agency.html
          curl -fLsS --max-time 30 https://webon.agency/robots.txt -o /tmp/webon-robots.txt
          echo 'WebON Agency public site reachable.'
