name: Deploy WebON Agency to adm.tools
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webon-agency-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Validate staging safety
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f privacy.html
          test -d assets
          grep -Eqi 'noindex' index.html
          grep -Eq '^Disallow: /$' robots.txt
          echo "Staging safeguards present."
      - name: Configure verified SSH
        env:
          DEPLOY_KEY: ${{ secrets.WEBON_AGENCY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBON_AGENCY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Missing SSH private key secret'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing verified SSH known_hosts secret'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/webon_agency
          chmod 600 ~/.ssh/webon_agency
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload WebON Agency only
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='README.md' \
            -e "ssh -i $HOME/.ssh/webon_agency -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22" \
            ./ bb471191@bb471191.ftp.tools:/home/bb471191/webon.agency/www/
      - name: Check public staging page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 30 https://webon.agency/ -o /tmp/webon-agency.html
          grep -q 'WebON Agency' /tmp/webon-agency.html
          grep -Eqi 'noindex' /tmp/webon-agency.html
          curl --fail --location --silent --show-error --max-time 30 https://webon.agency/robots.txt -o /tmp/webon-agency-robots.txt
          grep -Eq '^Disallow: /$' /tmp/webon-agency-robots.txt
          echo 'WebON Agency staging deployed and still excluded from indexing.'
