name: Deploy WebON Agency to adm.tools
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webon-agency-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Validate staging safety
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f privacy.html
          test -d assets
          test -f sitemap.xml
          ! grep -Eqi '<meta name="robots" content="[^"]*noindex' index.html
          grep -Eq '^Allow: /
      - name: Configure known SSH host
        env:
          KNOWN_HOSTS: ${{ secrets.WEBON_AGENCY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KNOWN_HOSTS" || { echo 'Missing SSH known_hosts secret'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Install password SSH deployment tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
      - name: Upload WebON Agency only
        env:
          SSH_PASSWORD: ${{ secrets.WEBON_AGENCY_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'Missing WEBON_AGENCY_SSH_PASSWORD secret'; exit 1; }
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -avz --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='README.md' \
            -e "ssh -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes" \
            ./ bb471191@bb471191.ftp.tools:/home/bb471191/webon.agency/www/
      - name: Check public staging page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 30 https://webon.agency/ -o /tmp/webon-agency.html
          grep -q 'WebON Agency' /tmp/webon-agency.html
          ! grep -Eqi '<meta name="robots" content="[^"]*noindex' /tmp/webon-agency.html
          curl --fail --location --silent --show-error --max-time 30 https://webon.agency/robots.txt -o /tmp/webon-agency-robots.txt
          grep -Eq '^Allow: /
 robots.txt
          echo "Production SEO files present."
      - name: Configure known SSH host
        env:
          KNOWN_HOSTS: ${{ secrets.WEBON_AGENCY_SSH_KNOWN_HOSTS }}
