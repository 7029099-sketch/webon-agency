<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebON Telegram Group Setup</title><style>body{font:16px system-ui;background:#091522;color:#eee;padding:35px;max-width:580px;margin:auto}input,button{font:inherit;padding:12px;border-radius:8px}input{width:100%;box-sizing:border-box}button{margin-top:14px;background:#1779f2;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>WebON Agency · Group ID setup</h1><p>Enter your private <b>webhook_secret</b> from the server config. Never enter your Telegram bot token here. The key is sent by HTTPS POST, never stored in this page.</p><label for="key">Private setup key</label><input type="password" id="key" autocomplete="off"><button type="button" id="check">Find Telegram groups</button><pre id="result" aria-live="polite"></pre><script>document.querySelector('#check').onclick=async()=>{const o=document.querySelector('#result');const key=document.querySelector('#key').value;o.textContent='Checking...';try{const r=await fetch('/chat-api.php?discover=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setup_key:key}),cache:'no-store'});const x=await r.json();o.textContent=x.ok?(x.groups.length?x.groups.map(g=>g.title+' | '+g.id+' | '+g.type).join('\n'):'No groups found yet. Send /start@WebONAgencyLeadsBot in the Telegram group and try again.'):(x.error||'Could not fetch Telegram groups')}catch(e){o.textContent='Request failed'}document.querySelector('#key').value=''}</script></body></html>
